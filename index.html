<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oficina de agentes · MD Matemáticas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;600&display=swap">
<style>
:root{--bg:#0b0f19;--fg:#e8eef7;--muted:#93a0b8;--card:#121a2b;--line:#27324a;--mint:#4ECDC4;--sun:#FFE66D;--coral:#FF6B6B;--navy:#292F36;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px}
main{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.head{display:flex;align-items:center;gap:14px}
.head svg{width:48px;height:48px;flex:none}
h1{font:800 clamp(26px,4.6vw,38px)/1.05 "Bricolage Grotesque",Inter,sans-serif;margin:0}
h1 span{color:var(--coral)}
.sub{color:var(--muted);margin:4px 0 0}
.stage{position:relative;border:3px solid #1d2742;border-radius:12px;overflow:hidden;background:#0a0e1a;box-shadow:0 0 0 1px #05070d,0 12px 30px rgba(0,0,0,.45)}
#cv{display:block;width:100%;height:auto;image-rendering:pixelated}
#ov{position:absolute;inset:0;pointer-events:none;z-index:2}
.ag{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap}
.lab{position:relative;background:rgba(8,13,24,.92);border:1px solid var(--c,#8a93a6);padding:1px 6px 2px;text-align:center;font:400 clamp(9px,1.2vw,15px)/1 VT323,monospace;letter-spacing:.04em;text-transform:uppercase;color:#f4f7fb}
.lab b{display:block;font-weight:400;color:var(--sun)}
.lab i{display:block;font-style:normal;color:var(--c,#8a93a6)}
.lab.esp{border-color:transparent;padding:3px 8px 4px;background:rgba(40,8,10,.9);
 background-image:linear-gradient(#ff5a4f,#ff5a4f),linear-gradient(#ff5a4f,#ff5a4f),linear-gradient(#ff5a4f,#ff5a4f),linear-gradient(#ff5a4f,#ff5a4f),linear-gradient(#ff5a4f,#ff5a4f),linear-gradient(#ff5a4f,#ff5a4f),linear-gradient(#ff5a4f,#ff5a4f),linear-gradient(#ff5a4f,#ff5a4f);
 background-size:7px 2px,2px 7px,7px 2px,2px 7px,7px 2px,2px 7px,7px 2px,2px 7px;
 background-position:0 0,0 0,100% 0,100% 0,0 100%,0 100%,100% 100%,100% 100%;background-repeat:no-repeat}
.bub{font:400 clamp(11px,1.6vw,19px)/1.05 VT323,monospace;color:#10151f;background:#f4f7fb;border:2px solid #10151f;padding:2px 7px;max-width:210px;white-space:normal;text-align:center;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
.room{position:absolute;transform:translate(-50%,-50%);font:400 clamp(9px,1.25vw,15px)/1 VT323,monospace;letter-spacing:.12em;color:#cfe3ff;background:rgba(10,16,30,.78);border:1px solid #3a4a6e;padding:1px 6px;white-space:nowrap}
.tray{position:absolute;transform:translate(-50%,-50%);font:400 clamp(12px,1.8vw,22px)/1 VT323,monospace;color:#10151f;background:#FFE66D;border:2px solid #10151f;padding:0 6px}
.win{position:absolute;background:rgba(14,26,46,.93);border:2px solid #5b84b8;font-family:VT323,monospace;color:#d8e6fa;box-shadow:0 0 0 1px #07101f,0 6px 14px rgba(0,0,0,.5)}
.win .tb{display:flex;justify-content:space-between;align-items:center;background:#27446e;padding:0 6px;font-size:clamp(11px,1.35vw,16px);letter-spacing:.08em}
.win .tb u{text-decoration:none;letter-spacing:.2em}
.win .bd{padding:4px 8px 6px;font-size:clamp(11px,1.45vw,17px);line-height:1.1}
#winChat{left:1.2%;top:2.5%;width:31%}
#winChat p{margin:0 0 3px}#winChat .who{color:#7ee08f}#winChat .who.dir{color:#6fd0ff}
#winChat .in{margin-top:4px;height:clamp(10px,1.5vw,16px);border:1px solid #5b84b8;background:#0a1424;position:relative}
#winChat .in:after{content:"";position:absolute;right:2px;top:2px;border-left:7px solid #6fd0ff;border-top:4px solid transparent;border-bottom:4px solid transparent}
#winTab{right:1.2%;bottom:3%;width:30%}
#winTab .bd{padding:3px 9px 6px}
#winTab h3{margin:0 0 3px;font:400 clamp(13px,1.8vw,22px)/1 VT323,monospace;letter-spacing:.1em;color:#d8e6fa;border-bottom:1px solid #3a5a8c;padding-bottom:2px}
#winTab dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:0 8px}#winTab dd{margin:0;color:#7ee08f;text-align:right}#winTab dd.warn{color:#ff7a70}
@media(max-width:760px){.win{display:none}.lab{font-size:9px}}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl button,.ctl select{font:600 14px Inter,sans-serif;padding:8px 12px;border-radius:9px;border:2px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.ctl button.main{background:var(--mint);color:#10151f;border-color:var(--mint)}
.ctl button:disabled{opacity:.5;cursor:default}
.ctl .prog{flex:1;min-width:140px;height:8px;border-radius:5px;background:var(--line);overflow:hidden}.ctl .prog i{display:block;height:100%;width:0;background:var(--mint)}
#estado{font-size:13px;color:var(--muted)}
.panels{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}@media(max-width:700px){.panels{grid-template-columns:1fr}}
.card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px 16px}.card h2{font:800 14px/1 "Bricolage Grotesque",Inter,sans-serif;margin:0 0 10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:6px;max-height:210px;overflow:auto;font-size:14px}.chat .t{color:var(--muted);font-size:12px;margin-right:6px}.chat b{font-weight:600}
.board{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0;font-size:14px}.board dt{color:var(--muted)}.board dd{margin:0;font-weight:600;text-align:right}.ok{color:#4be39a}.warn{color:#ff7a70}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}.legend b{color:var(--fg)}
</style></head><body><main>
<div class="head">
 <svg viewBox="0 0 123 123" role="img" aria-label="MD Matemáticas"><path d="M20 0H58V58H0V20A20 20 0 0 1 20 0Z" fill="#4ECDC4"/><path d="M65 0H103A20 20 0 0 1 123 20V58H65Z" fill="#292F36"/><path d="M0 65H58V123H20A20 20 0 0 1 0 103Z" fill="#FF6B6B"/><path d="M65 65H123V103A20 20 0 0 1 103 123H65Z" fill="#FFE66D"/><path d="M17.5 29H40.5M29 17.5V40.5" fill="none" stroke="#FFE66D" stroke-width="13" stroke-linecap="round"/><path d="M82.5 28.5H105.5" fill="none" stroke="#FF6B6B" stroke-width="12" stroke-linecap="round"/><path d="M21 86L37 102M37 86L21 102" fill="none" stroke="#292F36" stroke-width="13" stroke-linecap="round"/><path d="M82 81.5H106M82 105.5H106" fill="none" stroke="#4ECDC4" stroke-width="11" stroke-linecap="round"/></svg>
 <div><h1>Oficina de agentes</h1><p class="sub" id="resumen">Cargando estado…</p></div>
</div>
<div class="stage"><canvas id="cv"></canvas><div id="ov"></div>
 <div class="win" id="winChat"><div class="tb"><span>CHAT DE LA OFICINA</span><u>_ ▫ ×</u></div><div class="bd"><div id="wChat"></div><div class="in"></div></div></div>

</div>

</div>
<div class="legend"><span><b>Contenido</b> Renato, Sebastián</span><span><b>Estudio y vídeo</b> Lola, Edu</span><span><b>Sistemas</b> Vera</span><span><b>Redes y correo</b> Marta, Pablo</span><span><b>Despacho</b> tú (bandeja de aprobación)</span><span><b>I+D</b> Irene</span></div>
</main>
<script>
const W=26,H=20,OX=400,OY=96,CW=940,CH=580;
const cv=document.getElementById('cv'),cx=cv.getContext('2d'),ov=document.getElementById('ov');cv.width=CW;cv.height=CH;
const iso=(x,y)=>[Math.round(OX+(x-y)*20),Math.round(OY+(x+y)*10)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let SPEED=1,runId=0;
const OL='#121724';
const sh=(hex,f)=>{const n=parseInt(hex.slice(1),16);const c=v=>Math.max(0,Math.min(255,Math.round(v*f)));return'#'+[(n>>16)&255,(n>>8)&255,n&255].map(v=>c(v).toString(16).padStart(2,'0')).join('')};
const P=(a,b,h)=>{const[sx,sy]=iso(a,b);return[sx,sy-h*2]};
function poly(pts,fill,ol,lw){cx.fillStyle=fill;cx.beginPath();pts.forEach(([a,b],i)=>i?cx.lineTo(a,b):cx.moveTo(a,b));cx.closePath();cx.fill();
 if(ol){cx.strokeStyle=ol;cx.lineWidth=lw||2;cx.lineJoin='round';cx.stroke()}}
function tile(x,y,c){const[sx,sy]=iso(x,y);poly([[sx,sy],[sx+20,sy+10],[sx,sy+20],[sx-20,sy+10]],c,sh(c,.88),1)}
function box(x,y,w,d,h,z,top,left,right,ol=OL){
 poly([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)],left,ol);
 poly([P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)],right,ol);
 poly([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)],top,ol)}
const line3=(a,b,h,c,t)=>{const p=P(a,b,h),q=P(t[0],t[1],h);cx.strokeStyle=c;cx.lineWidth=2;cx.beginPath();cx.moveTo(p[0],p[1]);cx.lineTo(q[0],q[1]);cx.stroke()};
// rectángulo sobre la cara frontal (plano y fijo) o lateral (plano x fijo)
const quadY=(a,b,y,h0,h1,c,ol)=>poly([P(a,y,h0),P(b,y,h0),P(b,y,h1),P(a,y,h1)],c,ol,ol?2:0);
const quadX=(x,a,b,h0,h1,c,ol)=>poly([P(x,a,h0),P(x,b,h0),P(x,b,h1),P(x,a,h1)],c,ol,ol?2:0);
function screen(mx,my,mw,md,mh,z,seed,t){const y=my+md,a=mx+.1*mw,b=mx+.9*mw;
 quadY(a,b,y,z+1.2,z+mh-1,'#06201b');
 const L=[.9,.55,.75,.4,.65];
 for(let i=0;i<4;i++){const len=L[(i+seed+(t?Math.floor(t*2):0))%5]*(b-a-.15);line3(a+.06,y,z+mh-2.2-i*1.6,i%3===1?'#ffe66d':(i===2?'#7aa7ff':'#4be39a'),[a+.06+len,y])}}
// ---------- Mapa ----------
const ROOMS=[
 {n:'CONTENIDO',x0:0,x1:8,y0:0,y1:5,c:'#cdbf9f',w:'#9c7a58'},
 {n:'ESTUDIO Y VÍDEO',x0:0,x1:8,y0:7,y1:12,c:'#c3bcd8',w:'#7c6aab'},
 {n:'SISTEMAS',x0:0,x1:8,y0:14,y1:19,c:'#adc0cf',w:'#587088'},
 {n:'REDES Y CORREO',x0:17,x1:25,y0:0,y1:5,c:'#b2dccf',w:'#4a9a8a'},
 {n:'DIRECCIÓN',x0:17,x1:25,y0:7,y1:12,c:'#8d5d3b',w:'#45558a'},
 {n:'I+D',x0:17,x1:25,y0:14,y1:19,c:'#ecdf9f',w:'#b89a3a'}];
const HALL={x0:10,x1:15,y0:0,y1:19,c:'#d5d0c4',w:'#7c8aa0'};
const DOORS=[[9,3],[9,10],[9,17],[16,3],[16,10],[16,17]];
const ST={
 R:{n:'Renato',rol:'Redactor',desk:[1,1,3,1],seat:[2,2],coat:'#2b3347',hair:'#3b2a22',shirt:'#ffffff',tie:'#4ECDC4'},
 S:{n:'Sebastián',rol:'Revisor',desk:[5,1,3,1],seat:[6,2],coat:'#262b38',hair:'#1b1f2a',shirt:'#f2f2f2',tie:'#FF6B6B'},
 L:{n:'Lola',rol:'Voz',desk:[1,8,3,1],seat:[2,9],coat:'#6b4fa0',hair:'#8a4a3a',shirt:'#ffe66d'},
 E:{n:'Edu',rol:'Vídeo',desk:[5,8,3,1],seat:[6,9],coat:'#2b3347',hair:'#262A3D',shirt:'#ffffff',tie:'#FFE66D'},
 V:{n:'Vera',rol:'Sistemas',desk:[1,15,3,1],seat:[2,16],coat:'#254a47',hair:'#2a2a2a',shirt:'#9ad9cf'},
 M:{n:'Marta',rol:'Redes',desk:[18,1,3,1],seat:[19,2],coat:'#2b3347',hair:'#5a3a6b',shirt:'#ffffff',tie:'#9AD9CF'},
 P:{n:'Pablo',rol:'Correo',desk:[22,1,3,1],seat:[23,2],coat:'#33384a',hair:'#6b4a2a',shirt:'#f2f2f2',tie:'#C9B8F0'},
 D:{n:'Tú',rol:'Director',desk:[19,8,4,2],seat:[20,7],coat:'#1c2130',hair:'#222',shirt:'#ffffff',tie:'#FFE66D'},
 I:{n:'Irene',rol:'I+D',desk:[18,15,3,1],seat:[19,16],coat:'#8a6a1c',hair:'#7a3b2e',shirt:'#fff3c2'}};
Object.assign(ST.R,{skin:'#f1c7a0',style:'short'});Object.assign(ST.S,{skin:'#c98e65',style:'short',glasses:true});
Object.assign(ST.L,{skin:'#f6d3b3',style:'long'});Object.assign(ST.E,{skin:'#b87a52',style:'curly'});
Object.assign(ST.V,{skin:'#e8b98f',style:'bun',glasses:true});Object.assign(ST.M,{skin:'#f1c7a0',style:'long'});
Object.assign(ST.P,{skin:'#d9a27c',style:'short',beard:true});Object.assign(ST.D,{skin:'#8a5a3c',style:'short'});
Object.assign(ST.I,{skin:'#f6d3b3',style:'bun'});
// muebles sin personaje
const EXTRA=[
 {t:'cab',x:6,y:15},{t:'cab',x:7,y:15},{t:'cpu',x:6,y:17},
 {t:'wb',x:22,y:15,w:3},{t:'plant',x:11,y:0},{t:'cab',x:14,y:0},{t:'plant',x:15,y:18},{t:'plant',x:8,y:5},
 {t:'cooler',x:15,y:9},{t:'sofa',x:18,y:11,w:3},{t:'shelf',x:23,y:11,w:2},{t:'lamp',x:25,y:7},{t:'plant',x:25,y:11},{t:'vchair',x:20,y:10},{t:'vchair',x:21,y:10},{t:'cab',x:24,y:5},{t:'cab',x:8,y:12}];
const TRAY=[22,8];
const blk=Array.from({length:H},()=>Array(W).fill(true));
const isFloor=(x,y)=>(x>=0&&x<=8||x>=10&&x<=15||x>=17&&x<=25)&&y>=0&&y<H&&!(y===6||y===13);
for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(isFloor(x,y))blk[y][x]=false;
DOORS.forEach(([x,y])=>blk[y][x]=false);
const block=(x,y,w,d)=>{for(let j=0;j<d;j++)for(let i=0;i<w;i++)blk[Math.floor(y+j)][Math.floor(x+i)]=true};
for(const k in ST)block(...ST[k].desk);EXTRA.forEach(e=>block(e.x,e.y,e.w||1,1));
function bfs(a,b){const key=(x,y)=>y*W+x,prev=new Map([[key(...a),null]]),q=[a];
 while(q.length){const c=q.shift();if(c[0]===b[0]&&c[1]===b[1])break;
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=c[0]+dx,ny=c[1]+dy;if(nx<0||ny<0||nx>=W||ny>=H||blk[ny][nx]||prev.has(key(nx,ny)))continue;prev.set(key(nx,ny),c);q.push([nx,ny])}}
 if(!prev.has(key(...b)))return[];const path=[];let c=b;while(c){path.unshift(c);c=prev.get(key(...c))}return path.slice(1)}
// ---------- Agentes ----------
const AG={};for(const k in ST){const s=ST[k];AG[k]={k,...s,x:s.seat[0],y:s.seat[1],path:[],res:null,typing:false,paper:false,bub:null,bcol:null,st:['Libre','libre'],t:0,face:0}}
const SKIN='#f3c9a5';
function dibujaAgente(a){cx.save();const[sx0,sy0]=iso(a.x+.5,a.y+.5);const mov=a.path.length>0,f=mov?Math.floor(a.t*6)%2:0;
 const sit=!mov&&Math.abs(a.x-a.seat[0])<.05&&Math.abs(a.y-a.seat[1])<.05;
 const bob=mov?-f:0,front=mov&&a.face>0,SK=a.skin||SKIN,sd=sh(SK,.82);
 cx.translate(Math.round(sx0),Math.round(sy0+6)+(sit?6:0));cx.scale(2,2);
 cx.fillStyle='rgba(0,0,0,.3)';cx.fillRect(-6,-1,12,3);
 const parts=[];const add=(c,x,y,w,h)=>parts.push([c,x,y+bob,w,h]);
 const dk=sh(a.coat,.72),lt=sh(a.coat,1.25),hc=a.hair,long=a.style==='long';
 if(!sit){add('#1f2536',-3,-7,3,7+(f?-1:0));add('#1f2536',0,-7+(f?-1:0),3,7-(f?-1:0));add('#0d1019',-4,-1,4,1);add('#0d1019',0,-1,4,1)}
 if(long&&!front)add(hc,-5,-24,10,15);                  // melena por la espalda
 add(a.coat,-5,-17,10,10);add(dk,-5,-8,10,1);add(lt,-5,-17,2,3);add(lt,3,-17,2,3);
 add(dk,-7,-16,2,9);add(dk,5,-16,2,9);add(SK,-7,-7,2,2);add(SK,5,-7,2,2);
 if(front){add(a.shirt,-1,-17,2,5);if(a.tie)add(a.tie,0,-16,1,6)}else if(a.shirt){add(a.shirt,-2,-18,4,1)}
 add(SK,-1,-20,2,3);                                     // cuello
 add(SK,-4,-28,8,9);add(SK,-5,-25,1,3);add(SK,4,-25,1,3); // cabeza y orejas
 // peinado
 const top=a.style==='curly'?[-5,-31,10,5]:[-4,-30,8,4];
 add(hc,...top);
 if(front){add(hc,-4,-26,1,4);add(hc,3,-26,1,4);if(long){add(hc,-5,-26,2,11);add(hc,3,-26,2,11)}}
 else{add(hc,-4,-26,sit?4:8,6);if(a.style==='curly'){add(hc,-5,-27,1,5);add(hc,4,-27,1,5)}}
 if(a.style==='bun')add(hc,-1,-33,3,3);
 for(const[c,x,y,w,h]of parts){cx.fillStyle=OL;cx.fillRect(x-1,y-1,w+2,h+2)}
 for(const[c,x,y,w,h]of parts){cx.fillStyle=c;cx.fillRect(x,y,w,h)}
 const R=(c,x,y,w,h)=>{cx.fillStyle=c;cx.fillRect(x,y+bob,w,h)};
 if(front){ // rostro de frente
  R('#2a1d18',-3,-25,2,1);R('#2a1d18',1,-25,2,1);                       // cejas
  R('#ffffff',-3,-24,2,2);R('#ffffff',1,-24,2,2);R('#1b2a4a',-2,-24,1,2);R('#1b2a4a',2,-24,1,2); // ojos
  R(sd,0,-22,1,2);R('#b5564f',-1,-20,2,1);R('#e8867e',-1,-20,1,1);       // nariz y boca
  R('rgba(255,120,110,.35)',-4,-21,1,1);R('rgba(255,120,110,.35)',3,-21,1,1);
  if(a.glasses){R('#10151f',-4,-25,4,1);R('#10151f',0,-25,4,1);R('#10151f',-4,-22,4,1);R('#10151f',0,-22,4,1);R('#10151f',-4,-25,1,4);R('#10151f',3,-25,1,4);R('#10151f',-1,-24,2,1)}
  if(a.beard){R(hc,-3,-20,6,2);R(hc,-4,-23,1,4);R(hc,3,-23,1,4);R('#b5564f',-1,-20,2,1)}
 }else if(sit){ // medio perfil hacia el espectador: se ve media cara
  R('#2a1d18',0,-25,4,1);R('#ffffff',1,-24,2,2);R('#1b2a4a',2,-24,1,2);R(sd,4,-22,1,1);R('#b5564f',1,-20,2,1);R('rgba(255,120,110,.35)',0,-21,1,1);
  if(a.glasses){R('#10151f',0,-25,4,1);R('#10151f',0,-22,4,1);R('#10151f',0,-25,1,4);R('#10151f',3,-25,1,4)}

  [['AGENTES ACTIVOS',act],['VÍDEOS EN COLA',st.pendientes||0],['ESTADO',sy.estado==='alerta'?'ATENCIÓN':'OPERATIVO']].forEach(([k,v])=>{const dt=document.createElement('dt');dt.textContent=k+':';const dd=document.createElement('dd');dd.textContent=v;if(k==='ESTADO'&&v==='ATENCIÓN')dd.className='warn';wt.append(dt,dd)})}
 trayEl.textContent=st.pendientes||0;
 const ago=Math.max(0,Math.round((Date.now()-Date.parse(st.actualizado||Date.now()))/60000));
 document.getElementById('resumen').textContent=`${st.pendientes||0} vídeo(s) esperando tu aprobación · ${st.aprobados||0} aprobados en total`;
 document.getElementById('estado').textContent=modo==='vivo'?`Directo · actualizado hace ${ago} min · fase: ${fase()}${st.detalle?' · '+st.detalle:''}`:'Reproduciendo el histórico del día';}
async function cargar(){try{const r=await fetch('status.json?t='+Date.now(),{cache:'no-store'});st=await r.json();eventosVivo=st.eventos||[];paneles()}catch(e){}}
async function ciclo(my){const f=fase();
 if(f==='redacta'){await trabajar('R','Redactando la variante…',3000,my);await entregar('R','S','Revisando cuentas…',2500,my)}
 else if(f==='voz')await trabajar('L','Grabando la voz…',4000,my);
 else if(f==='render')await trabajar('E','Renderizando en GitHub (~3 min)',4000,my);
 else if(f==='aprobar')await entregar('E','D','Listo: revísalo en Telegram',3500,my,'#1f9d78');
 else if(f==='redes')await trabajar('M','Revisando comentarios y métricas…',4000,my);
 else if(f==='correo')await trabajar('P','Leyendo el correo de la web…',4000,my);
 else if(f==='tips')await trabajar('I','Preparando una ficha de tips…',4000,my);
 else if(f==='fallo'){say(AG.S,'Hoy no salió variante verificada','#d8514a');await wait(3500,my);AG.S.bub=null}
 else{ // reposo: alguien da una vuelta por el pasillo
  const libres=['R','S','L','E','M','P','I'].filter(k=>true),k=libres[Math.floor(Math.random()*libres.length)],a=AG[k];
  await goto(a,12+Math.floor(Math.random()*2),6+Math.floor(Math.random()*8),my);say(a,['Un café ☕','Todo tranquilo','Esperando el turno de las 08:00'][Math.floor(Math.random()*3)]);await wait(2500,my);a.bub=null;await home(k,my)}}
async function vivo(){const my=++runId;modo='vivo';SPEED=1;hush();document.getElementById('bVivo').hidden=true;document.getElementById('bPlay').disabled=false;
 try{while(runId===my)await ciclo(my)}catch(e){if(e!=='cancel')console.error(e)}}
// ---------- Reproducción del día ----------
const KEY={Renato:'R','Sebastián':'S',Lola:'L',Edu:'E',Marta:'M',Pablo:'P',Vera:'V',Irene:'I','Tú':'D'};
let replayShown=[];
async function reproducir(){const dia=document.getElementById('sDia').value;let ev;
 try{const r=await fetch('historial/'+dia+'.json?t='+Date.now(),{cache:'no-store'});ev=await r.json()}catch(e){ev=[]}
 if(!ev.length){document.getElementById('pgT').textContent='Sin eventos ese día';return}
 const my=++runId;modo='replay';SPEED=+document.getElementById('sVel').value;hush();replayShown=[];paneles();
 document.getElementById('bVivo').hidden=false;document.getElementById('bPlay').disabled=true;
 for(const k in AG){AG[k].path=[];AG[k].res=null;AG[k].typing=false;AG[k].paper=false;AG[k].x=ST[k].seat[0];AG[k].y=ST[k].seat[1];AG[k].st=['Libre','libre']}
 let prev=null;
 try{for(let i=0;i<ev.length;i++){const e=ev[i],k=KEY[e.quien];SPEED=+document.getElementById('sVel').value;
   document.getElementById('pg').style.width=(i/ev.length*100)+'%';document.getElementById('pgT').textContent=`${e.t} · ${i+1}/${ev.length}`;
   replayShown.push(e);paneles();
   if(!k){await wait(1500,my);continue}
   const rojo=/rechazo|ninguna|error|aviso/i.test(e.texto)?'#d8514a':null;
   for(const kk in AG)AG[kk].st=['Libre','libre'];AG[k].st=['Trabajando',rojo?'alerta':'trab'];
   if(prev&&prev!==k&&k!=='D')await entregar(prev,k,e.texto,2200,my,rojo);
   else if(k==='D'&&prev&&prev!=='D')await entregar(prev,'D',e.texto,2200,my,'#1f9d78');
   else await trabajar(k,e.texto,2200,my,rojo);
   prev=k}
  document.getElementById('pg').style.width='100%';document.getElementById('pgT').textContent='Fin del día';await sleep(1500);}
 catch(e){if(e!=='cancel')console.error(e);return}
 vivo()}
document.getElementById('bPlay').onclick=reproducir;document.getElementById('bVivo').onclick=()=>{document.getElementById('pg').style.width='0';document.getElementById('pgT').textContent='';vivo()};
async function dias(){const sel=document.getElementById('sDia');let l=[];try{l=await (await fetch('historial/dias.json?t='+Date.now(),{cache:'no-store'})).json()}catch(e){}
 l.slice().reverse().forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;sel.appendChild(o)});
 const o=document.createElement('option');o.value='ejemplo';o.textContent='Día de ejemplo (demo)';sel.appendChild(o)}
(async()=>{await dias();await cargar();setInterval(cargar,30000);setInterval(paneles,60000);vivo()})();
</script></body></html>
